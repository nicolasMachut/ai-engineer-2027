theory:`
<h4>1. Tokens, not words</h4>
<p>An LLM never sees text. It sees <b>tokens</b>: sub-word chunks (roughly 3 to 4 characters of English, often fewer for French or code). Everything is priced, limited and computed in tokens: the <b>context window</b> (what the model can read at once), the output limit, latency and cost. Practical rule: 1,000 tokens is about 750 English words, but tokenizers differ by model (Claude models since 4.7 use a newer tokenizer that produces about 30% more tokens for the same text): always count with the target model. French and JSON are more expensive than plain English.</p>
<h4>2. Next-token prediction</h4>
<p>At its core the model does one thing: given all previous tokens, it outputs a probability distribution over the next token. Generation is a loop: pick a token, append it, predict again. <b>Temperature</b> reshapes the distribution (0 = almost deterministic, higher = more diverse). Note: current Claude models fix sampling on the API side and reject custom temperature/top_p values; you control behaviour through prompts, schemas and the effort setting. Open-weight models still expose temperature. Consequence: the model has no separate "truth database". When the right continuation is unlikely or absent from training data, it still produces a fluent one. That is a hallucination.</p>
<h4>3. Embeddings and attention</h4>
<p>Each token becomes a vector (an <b>embedding</b>) that encodes meaning by position in a high-dimensional space: similar meanings end up close. The <b>transformer</b> stacks layers of <b>self-attention</b>: every token looks at every other token in the context and decides what is relevant to it. This is why prompt structure matters: clearly delimited sections and explicit references make attention's job easier. Attention cost grows with context length, which is why long contexts are slower and more expensive.</p>
<h4>4. How a model is built</h4>
<ul>
<li><b>Pre-training</b>: predict the next token on a huge corpus. Produces raw knowledge and language ability, with a knowledge cut-off date.</li>
<li><b>Instruction tuning</b>: train on (instruction, good answer) pairs so the model follows requests.</li>
<li><b>Preference training</b> (RLHF, RLAIF, constitutional methods at Anthropic): optimise toward answers humans or a written set of principles judge better: helpful, honest, harmless.</li>
<li><b>Reasoning training</b>: models such as Claude can "think" before answering. Current Claude models use <b>adaptive thinking</b> tuned with an <b>effort</b> parameter (low to max); manual thinking budgets only exist on older models. More test-time compute usually means better results on hard tasks, at higher cost and latency.</li>
</ul>
<h4>5. Failure modes you must recognise</h4>
<ul>
<li><b>Hallucination</b>: confident invention. Mitigate with grounding (RAG, documents in the prompt), citations and permission to say "I don't know".</li>
<li><b>Lost in the middle</b>: information buried in a very long context is used less reliably. Put key documents first and the question last.</li>
<li><b>Sycophancy</b>: agreeing with the user's framing. Ask for critique explicitly.</li>
<li><b>Knowledge cut-off</b>: the model does not know recent facts. Provide them or give it a search tool.</li>
<li><b>Non-determinism</b>: same input, different output. Design systems and tests for it (validation, retries, evals).</li>
</ul>
<h4>6. What this means for you as an engineer</h4>
<p>An LLM is a probabilistic component inside a deterministic system. Your job is to put it in a box: give it the right context, constrain its output, validate it, measure it, and design the fallback. Everything in this track builds on that sentence.</p>`,

"Non-determinism is a design constraint, not a bug to ignore."
],

id:"m02", phase:1, weeks:"3-4", hours:30,
title:"Prompt engineering for Claude, at a professional level",
why:"A good prompt is a specification. You already write specs; now you write them for a model.",
objectives:[
"Write system prompts that define role, context, rules and output format",
"Use Claude-specific techniques: XML tags, multishot examples, step-by-step thinking, long-context ordering",
"Get reliable structured output (JSON) and handle failures",
"Iterate on prompts with a test set instead of intuition"
],
theory:`
<h4>1. The prompt is a spec</h4>
<p>Think of the model as a brilliant new colleague with zero context about your company. A good prompt answers: <b>who are you</b> (role), <b>what is the situation</b> (context, audience, why it matters), <b>what exactly to do</b> (task, steps), <b>what good looks like</b> (format, length, examples) and <b>what not to do</b> (constraints). Anthropic's own guidance: be clear and direct, explain the purpose behind a rule, the model generalises better from reasons than from bare orders.</p>
<h4>2. Structure with XML tags</h4>
<p>Claude was trained to pay attention to XML-style tags. Separate instructions from data: <code>&lt;contract&gt;...&lt;/contract&gt;</code>, <code>&lt;instructions&gt;</code>, <code>&lt;examples&gt;</code>. Ask for output inside tags too (<code>&lt;answer&gt;</code>, <code>&lt;quotes&gt;</code>) so your code can parse it. Tags also protect you against content in documents being mistaken for instructions.</p>
<h4>3. Examples (multishot)</h4>
<p>3 to 5 diverse, realistic examples are the most powerful lever for format and tone. Make them varied (cover edge cases) and wrap them in <code>&lt;example&gt;</code> tags. Bad examples are copied faithfully, so curate them.</p>
<h4>4. Let it think</h4>
<p>For multi-step reasoning, ask for reasoning before the answer (in <code>&lt;thinking&gt;</code> tags you can strip), or raise the <b>effort</b> level (adaptive thinking) in the API. Ask for the final answer in a separate tag. For simple extraction, thinking only adds cost.</p>
<h4>5. Long context</h4>
<p>Put long documents at the top, instructions and question at the bottom. Ask the model to first extract relevant quotes into <code>&lt;quotes&gt;</code>, then answer from them. This reduces hallucination and gives you citations for free.</p>
<h4>6. Controlling output</h4>
<ul>
<li>Say what to do, not only what to avoid ("write in flowing prose paragraphs" beats "no bullet points").</li>
<li>Match the style of your prompt to the style you want back.</li>
<li>For JSON: give the schema, an example, and validate on your side. Prefer native structured output / tool schemas when available (next module).</li>
<li>Prefilling the assistant turn (starting the answer with <code>{</code>) was a classic trick; Claude 4.6+ models reject it. Use structured outputs or strict tool use instead.</li>
</ul>
<h4>7. Prompt chaining</h4>
<p>Split complex jobs into steps: extract, then analyse, then write. Each step is easier to test and debug. This is the bridge to agents (module 7).</p>
<h4>8. Iterate like an engineer</h4>
<p>Write 10 to 30 test inputs with expected outputs before tuning. Change one thing at a time. Keep prompts in version control with the test results. "It looks better" is not a measurement.</p>
<h4>9. Using Claude as your prompt engineer</h4>
<p>Ask Claude to critique and rewrite your prompt ("What is ambiguous? What would a new colleague misunderstand?"). The Anthropic Console has a prompt generator and improver; use them, then test.</p>`,

id:"m03", phase:1, weeks:"5-6", hours:30,
title:"The Claude API and platform",
why:"Production AI is API work: models, costs, limits, caching, batching and tools.",
objectives:[
"Call the Messages API from Java and from the command line, with streaming",
"Choose a model by quality, latency and cost (Fable, Opus, Sonnet, Haiku lines; Opus as the usual default, Haiku for routing and classification)",
"Use tool use, structured outputs, prompt caching, batches, citations and files",
"Estimate and control the cost of a feature before building it"

theory:`
<h4>1. The Messages API</h4>
<p>A request = model + system prompt + list of messages (user/assistant turns) + parameters (max tokens, tools, thinking/effort, output format). The API is <b>stateless</b>: you send the whole conversation every time. Memory, history and sessions are your application's job. Responses can be <b>streamed</b> (server-sent events) for better perceived latency.</p>
<h4>2. Picking a model</h4>
<p>Families: the largest model for the hardest reasoning and agentic coding, the mid-size model as the default workhorse, the smallest for fast, cheap, high-volume tasks (classification, routing, extraction). Pricing is per million input and output tokens; output is several times more expensive than input. Always check the current models page: names and prices change.</p>
<h4>3. Tool use (function calling)</h4>
<p>You describe tools with a name, a description and a JSON Schema. The model answers with a <code>tool_use</code> block (which tool, which arguments); <b>your code executes it</b> and returns a <code>tool_result</code>; the model continues. This loop is the basis of every agent. Tool descriptions are prompts: precise names, when to use, what each parameter means. Anthropic also offers server-side tools (web search, code execution) that run on their side.</p>
<h4>4. Structured outputs</h4>
<p>To get guaranteed-valid JSON, define a schema with <b>structured outputs</b> (<code>output_config.format</code> with a JSON schema) or strict tool use; don't rely on forcing a tool choice, which recent models reject instead of hoping the model follows text instructions. Still validate on your side: a valid shape can carry wrong values.</p>
<h4>5. Prompt caching</h4>
<p>Mark a long, stable prefix (system prompt, documents, tool definitions) as cacheable. Later calls reuse it at a fraction of the input price and with lower latency. Design prompts with the <b>stable part first, variable part last</b> to benefit. For a RAG assistant over the same contract set, this can cut costs dramatically.</p>
<h4>6. Batch processing</h4>
<p>The Message Batches API processes large volumes asynchronously at a large discount (about half price), with results within 24 hours. Perfect for back-office jobs: classify 10,000 documents overnight.</p>
<h4>7. Citations, files, vision, PDFs</h4>
<p>Claude reads images and PDFs (text and visuals), can return citations pointing to the exact passages of provided documents, and a Files API lets you upload once and reference many times. These features remove a lot of custom code in document-heavy business apps.</p>
<h4>8. Limits and reliability</h4>
<p>Rate limits (requests and tokens per minute), overloaded errors and timeouts happen. Production code needs retries with exponential backoff, timeouts, idempotency for side effects and a fallback model or a graceful degradation path.</p>
<h4>9. Where Claude runs</h4>
<p>Directly through Anthropic's API, or through cloud platforms (AWS Bedrock, Google Vertex AI, Microsoft Foundry). Large French clients often require a cloud provider in the EU for contractual and data-residency reasons. Knowing all three access paths is a selling point.</p>`,

"Stateless API: you own history, memory and sessions.",
"Tool use loop: model proposes, your code executes, model continues.",

],

M.push({
id:"m04", phase:1, weeks:"7-8", hours:30,
title:"Claude Code mastery",
why:"Teams will hire the lead who makes everyone 2x faster with agentic coding, safely.",
objectives:[
"Run Claude Code with a deliberate workflow: explore, plan, implement, verify, commit",
"Configure CLAUDE.md, settings, permissions and memory for a Java/Spring codebase",
"Use skills, subagents, hooks, MCP servers and plugins, and know when each fits",
"Automate with headless mode and CI, and keep quality and security under control"
],
theory:`
<h4>1. What Claude Code is</h4>
<p>An agentic coding tool running in your terminal (and IDEs): it reads your repository, edits files, runs commands and tests, and loops until the task is done. You stay the architect and reviewer. The productivity gain comes from <b>delegating well-specified tasks</b> and <b>verifying fast</b>.</p>
<h4>2. The core workflow</h4>
<ol>
<li><b>Explore</b>: ask it to read the relevant code and explain it before touching anything.</li>
<li><b>Plan</b>: use plan mode; review and correct the plan. Most bad outcomes come from skipped planning.</li>
<li><b>Implement</b> in small steps, with tests first when possible (TDD works very well with agents).</li>
<li><b>Verify</b>: run the build and tests, read the diff, ask for a self-review.</li>
<li><b>Commit</b> with a clear message; keep changes reviewable.</li>
</ol>
<h4>3. Context management</h4>
<p><b>CLAUDE.md</b> holds always-on project context: build commands, conventions, architecture, do's and don'ts. Keep it short and factual; it is loaded every session. Use <code>/clear</code> between unrelated tasks and compaction for long ones. Give file paths and examples instead of vague descriptions. Context is the main lever on quality.</p>
<h4>4. The extension layers (official model)</h4>
<ul>
<li><b>CLAUDE.md</b>: always-on context.</li>
<li><b>Skills</b>: markdown files with knowledge or workflows, loaded on demand (only their description is loaded at start). Ideal for "how we write a Spring REST endpoint here" or "release checklist".</li>
<li><b>Subagents</b>: isolated context windows for focused jobs (code review, test writing, research) that return a summary; they protect the main context.</li>
<li><b>Hooks</b>: deterministic automation on lifecycle events (e.g. run the formatter after each edit, block edits to a protected folder). Use hooks for rules that must <i>always</i> happen, not prompts.</li>
<li><b>MCP servers</b>: connections to external systems (databases, Jira, browsers, internal APIs).</li>
<li><b>Plugins and marketplaces</b>: package skills, hooks, subagents and MCP servers to share across a team.</li>
<li><b>Skills</b> (also invocable as /slash commands) for repeatable workflows.</li>
</ul>
<h4>5. Permissions and safety</h4>
<p>Allow-list safe commands (build, test, git status), require approval for risky ones, never put secrets in prompts or CLAUDE.md, and run fully autonomous modes only in sandboxes or containers. Review every diff that touches security, data migrations or money.</p>
<h4>6. Parallelism and automation</h4>
<p>Run several sessions on separate git worktrees for independent tasks. Headless mode (<code>claude -p</code>) lets scripts and CI call Claude Code: automated code review on pull requests, migration scripts, documentation generation. The Claude Agent SDK exposes the same engine to build your own agents.</p>
<h4>7. Where it shines and where it does not</h4>
<p>Shines: boilerplate, tests, refactors with good coverage, migrations, exploring unknown code, scripts, documentation. Weak spots: vague requirements, large cross-cutting changes without tests, subtle performance or concurrency issues, anything you cannot verify. Your value is in the specification and the verification.</p><h4>Security of coding agents</h4><p>A coding agent reads your repo, issues and MCP servers, so all of them are injection surfaces. Run it sandboxed (devcontainer), keep permission modes tight, use hooks as policy (block secrets, dangerous commands, force tests), scan for secrets, and vet every plugin, skill and MCP server like a dependency (supply chain). Agent Skills are now an open standard shared by most coding agents, and AGENTS.md/CLAUDE.md files are read by all of them.</p>`,

theory:`
<h4>1. Why Spring AI</h4>
<p>Spring AI brings Spring's usual strengths to AI: portable abstractions over providers, auto-configuration, testing support and observability. Version 2.0 went GA in June 2026 on the Spring Boot 4 line, with first-class MCP support and a reworked tool-calling loop. Know which version a client runs: 1.x and 2.x APIs differ in places.</p>
<h4>2. Core abstractions</h4>
<ul>
<li><b>ChatModel</b>: the low-level, provider-specific model client.</li>
<li><b>ChatClient</b>: the fluent API you use day to day: <code>chatClient.prompt().system(...).user(...).call().content()</code> or <code>.entity(MyRecord.class)</code>.</li>
<li><b>Prompt templates</b>: parameterised prompts loaded from resources, versioned with the code.</li>
<li><b>Structured output</b>: map the answer directly to a Java record or bean; Spring AI injects format instructions or uses native structured output when the provider supports it.</li>
<li><b>Advisors</b>: interceptors around calls (memory, RAG, logging, safety). They are the Spring AI equivalent of servlet filters and the main extension point.</li>
<li><b>Chat memory</b>: conversation history stored in memory, JDBC or other repositories, injected by an advisor.</li>
<li><b>EmbeddingModel and VectorStore</b>: the RAG foundations (next module).</li>
</ul>
<h4>3. Provider portability, with limits</h4>
<p>Switching providers is mostly configuration, but features differ (caching, thinking, citations, tool formats). Encapsulate provider-specific options in configuration and keep a test suite that runs against at least two providers or models.</p>
<h4>4. Testing AI code</h4>
<p>Unit-test everything around the model (prompt building, parsing, validation) with fakes. For the model itself, use a small set of recorded or live "evaluation tests" (module 10) instead of brittle exact-string assertions. Testcontainers helps for vector stores and local models.</p>
<h4>5. Observability</h4>
<p>Spring AI emits Micrometer metrics and traces: token usage, latency, model, errors. Wire them to your existing stack (Prometheus, Grafana, OpenTelemetry) on day one. A client will ask "how much does this cost per day?" in the first steering meeting.</p>`,

M.push({
id:"m06", phase:2, weeks:"11-14", hours:60,
title:"Embeddings, vector search and RAG",
why:"RAG is the number-one enterprise use case: answering from the company's own documents.",
objectives:[
"Understand embeddings, similarity and vector indexes",
"Build an ingestion pipeline: parsing, chunking, metadata, embedding, storage",
"Implement retrieval with filters, hybrid search and re-ranking",
"Produce grounded answers with citations and measure retrieval quality"
],
theory:`
<h4>1. Embeddings</h4>
<p>An embedding model turns text into a vector so that similar meanings are close (cosine similarity). Retrieval = embed the question, find the nearest chunks. Embedding models are separate from chat models; pick one suited to French and to your domain, and never mix vectors from two different embedding models in the same index.</p>
<h4>2. The RAG pipeline</h4>
<ol>
<li><b>Ingest</b>: read PDFs/Word/HTML (Apache Tika, PDF readers in Spring AI), clean the text, keep structure (headings, clause numbers).</li>
<li><b>Chunk</b>: split into passages of a few hundred tokens with some overlap. Chunk on structure (articles, sections) rather than blindly by length when you can.</li>
<li><b>Enrich</b>: attach metadata (document id, lease, tenant, date, clause, page). Metadata enables filtering and citations.</li>
<li><b>Embed and store</b> in a vector store (PGVector is the natural choice for Java shops already on PostgreSQL).</li>
<li><b>Retrieve</b>: top-k similar chunks, filtered by metadata (only this tenant's lease).</li>
<li><b>Generate</b>: pass chunks in tagged blocks, instruct to answer only from them, cite sources, say "not found" otherwise.</li>
</ol>
<h4>3. Improving retrieval</h4>
<ul>
<li><b>Hybrid search</b>: combine vector similarity with keyword search (BM25 / PostgreSQL full-text). Exact terms like "TEOM", article numbers or names are often missed by pure vectors.</li>
<li><b>Re-ranking</b>: retrieve 30 candidates, then let a re-ranker or a small model pick the best 5.</li>
<li><b>Query rewriting</b>: reformulate vague user questions, or generate sub-questions.</li>
<li><b>Contextual chunks</b>: prepend a short summary of the document to each chunk so it remains meaningful on its own (Anthropic's "contextual retrieval" technique).</li>
<li><b>When not to RAG</b>: if the whole corpus fits comfortably in the context window and is stable, just pass it (with caching). Simpler, often better.</li>
</ul>
<h4>4. Measuring RAG</h4>
<p>Measure retrieval separately from generation. Retrieval: does the correct chunk appear in the top-k (recall@k)? Generation: is the answer correct, complete and supported by the retrieved text (faithfulness)? Without this split you cannot tell which half to fix.</p>
<h4>5. Security and permissions</h4>
<p>Enforce access rights at retrieval time with metadata filters: a user must never get chunks from documents they are not allowed to read. This is the classic enterprise RAG failure.</p>`,

M.push({
id:"m07", phase:2, weeks:"15-17", hours:45,
title:"Tool calling and agent patterns",
why:"The market is moving from chatbots to agents that act. Knowing when NOT to build an agent is the senior part.",
objectives:[
"Implement tool calling in Spring AI with typed tools",
"Know the workflow patterns: chaining, routing, parallelisation, orchestrator-workers, evaluator-optimiser",
"Build a bounded agent loop with limits, human approval and audit",
"Choose between a workflow and an autonomous agent based on risk and value"
],
theory:`
<h4>1. Workflows vs agents</h4>
<p>Anthropic's "Building effective agents" draws the key line: <b>workflows</b> orchestrate LLM calls and tools through predefined code paths; <b>agents</b> let the model decide its own steps in a loop. Start with the simplest thing that works. Most business processes need a workflow with a few LLM steps, not a free agent.</p>
<h4>2. The patterns</h4>
<ul>
<li><b>Prompt chaining</b>: fixed sequence of steps with checks between them.</li>
<li><b>Routing</b>: classify the input, send it to the right specialised prompt or model (cheap model for easy cases).</li>
<li><b>Parallelisation</b>: run independent sub-tasks at once, or vote across several runs.</li>
<li><b>Orchestrator-workers</b>: a model breaks a task into sub-tasks dynamically and delegates them.</li>
<li><b>Evaluator-optimiser</b>: one call produces, another critiques, loop until good enough.</li>
<li><b>Autonomous agent</b>: model + tools + loop + stopping condition, for open-ended tasks.</li>
</ul>
<h4>3. Designing tools</h4>
<p>Tools are an interface for the model: clear names, precise descriptions, few parameters with explicit types and examples, helpful error messages the model can recover from. Prefer a few high-level tools ("findLeaseClause") over many low-level ones ("runSql"). Make side-effect tools explicit and idempotent.</p>
<h4>4. Keeping agents safe and useful</h4>
<ul>
<li>Limits: maximum iterations, budget in tokens and money, timeouts.</li>
<li><b>Human in the loop</b> for irreversible actions: sending an email, paying, deleting.</li>
<li>Least privilege: the agent's credentials can only do what the task needs.</li>
<li>Audit log of every tool call with inputs and outputs.</li>
<li>Treat tool outputs (web pages, emails, documents) as untrusted data: they can contain injected instructions (module 11).</li>
</ul>
<h4>5. Context engineering for agents</h4>
<p>Long-running agents degrade as context fills. Techniques: summarise history, store notes outside the context (a scratchpad file or memory tool), use subagents for isolated sub-tasks, load knowledge on demand (skills). You already see these mechanisms at work in your daily use of Claude.</p><h4>Platform features for context engineering (2026)</h4><p>Know what the API gives you before building it yourself: <b>compaction</b> (summarise old turns automatically), <b>context editing</b> (drop stale tool results), the <b>memory tool</b> (files the agent reads and writes across sessions), the <b>tool search tool</b> (load tool definitions on demand instead of sending 100 tools), <b>programmatic tool calling</b> (the model writes code that calls tools, keeping intermediate data out of the context), prompt caching, the Files API, <b>Managed Agents</b> (server-hosted agents with a sandbox) and Agent Skills in the API. Pick the managed option when it exists; write your own only when you need control.</p><h4>Context engineering</h4><p>In US postings, \"context engineering\" went from 9 to 703 mentions between 2024 and 2025 (Stanford AI Index 2026, Lightcast data). It means deciding what enters the model\'s context at each step: system instructions, tool definitions, retrieved documents, memory, previous results, and what to compress or drop. Treat the context window as a budget: measure tokens per step, keep tool outputs short and structured, summarise long histories, and load knowledge just in time instead of up front.</p>`,
takeaways:[
"Default to workflows; reach for autonomous agents only when steps can't be predicted.",
"Tools are prompts: design them for the model.",
"Limits, approvals, least privilege and audit are non-negotiable.",
"Context engineering decides whether long agents stay smart."
],

M.push({
id:"m08", phase:2, weeks:"18-19", hours:30,
title:"Model Context Protocol (MCP)",
why:"MCP is becoming the standard way to plug company systems into AI assistants. Java backends are perfect MCP servers.",
objectives:[
"Understand MCP: hosts, clients, servers; tools, resources, prompts; transports",
"Build an MCP server in Spring AI with annotations",
"Secure it: authentication, authorisation, input validation, rate limits",
"Consume MCP servers from Claude Code, Claude Desktop and your own apps"
],
theory:`
<h4>1. Why MCP</h4>
<p>Before MCP, every AI app needed custom integrations for every tool. MCP is an open protocol: a system exposes <b>tools</b> (actions), <b>resources</b> (readable data) and <b>prompts</b> (templates) once, and any MCP-compatible client (Claude Desktop, Claude Code, IDEs, your own agent) can use them.</p>
<h4>2. Architecture</h4>
<p>A <b>host</b> (e.g. Claude Desktop) runs <b>clients</b>, each connected to a <b>server</b>. Transports: stdio for local processes, Streamable HTTP for remote servers. Since spec revision 2026-07-28 the protocol is stateless by design: no handshake or session, every request carries its version and capabilities, so servers scale behind a plain load balancer. Messages follow JSON-RPC. Spring AI 2.1 (MCP Java SDK 2.2+) brings support for this revision; 2.0.x targets the earlier spec.</p>
<h4>3. MCP in Spring AI 2.x</h4>
<p>Spring AI 2.0 ships the official MCP Java SDK and annotations such as <code>@McpTool</code>, <code>@McpResource</code> and <code>@McpPrompt</code> to expose Spring beans, with WebMVC/WebFlux transports, Micrometer tracing and security integrations. It also provides MCP clients so your Spring app can consume other servers' tools.</p>
<h4>4. Security is the hard part</h4>
<ul>
<li>Authenticate clients with OAuth 2.1 (the MCP server is a resource server; validate the issuer, prefer Client ID Metadata Documents over dynamic client registration) and authorise per tool.</li>
<li>Validate every input as if it came from the internet.</li>
<li>Expose narrow, business-level tools, never raw SQL or shell.</li>
<li>Beware "tool poisoning": malicious tool descriptions or outputs from third-party servers. Only install servers you trust and review them.</li>
<li>Log and rate-limit.</li>
</ul>
<h4>5. Enterprise opportunity</h4>
<p>Many companies want "our assistant can read our ERP / tickets / contracts". A Java developer who can wrap an internal API as a secure MCP server in days, with tests and observability, is exactly what they need.</p><h4>MCP, A2A and the Agentic AI Foundation</h4><p>MCP connects an agent to tools and data; <b>A2A</b> (Agent2Agent, v1.0, Linux Foundation) connects agents to other agents across vendors (agent cards, tasks, streaming). MCP, AGENTS.md and Agent Skills are now governed by the Linux Foundation's Agentic AI Foundation. Note: Java is not a Tier 1 MCP SDK (TypeScript, Python, Go, C# are), so Spring AI support may lag the spec by a few months; check versions before promising a feature.</p>`,
takeaways:[
"Expose once, use from any MCP client.",
"Tools act, resources inform, prompts guide.",
"Spring AI annotations make Java MCP servers fast to build.",
"Security and narrow tool design are where you add value."
],
exercises:[
 {t:"A2A hello world", d:"Expose one of your agents with an A2A agent card and call it from a second agent. Write half a page on when you would use A2A vs MCP.", h:3},
{t:"Lease MCP server", d:"Expose your lease assistant as an MCP server: tools findClause, computeTaxProrata, nextRentDueDate; resource 'lease summary'. Use Spring AI annotations.", h:8},
{t:"Connect it", d:"Use it from Claude Desktop and from Claude Code. Note what the model understands well and badly from your tool descriptions; improve them.", h:4},
{t:"Secure it", d:"Add API-key or OAuth auth, per-tool authorisation and request logging. Write tests proving an unauthorised client cannot call computeTaxProrata.", h:8},
{t:"Client side", d:"From a Spring app, consume a public or local MCP server (e.g. filesystem or Git) and use its tools in a ChatClient conversation.", h:5},
{t:"Write about it", d:"Write a short English article: 'Turning a Spring service into an MCP server in one afternoon' with code snippets.", h:4}
],
quiz:[

{q:"Best transport for a remote, scalable MCP server?", o:["stdio","Streamable HTTP","FTP","Email"], a:1, w:"stdio is for local processes; Streamable HTTP is the remote transport and is stateless by design since spec 2026-07-28."},

{q:"Main value of MCP for an enterprise?", o:["Cheaper tokens","Integrate a system once and use it from many AI clients","Faster GPUs","Replace REST APIs"], a:1, w:"Standardised integration."}
],
resources:[{t:"Devoxx France 2026 : replays MCP (en français)",u:"https://www.youtube.com/@DevoxxFRvideos/search?query=MCP",k:"video",l:"fr",y:"2026-04"},
{k:"doc", t:"Model Context Protocol official site", u:"https://modelcontextprotocol.io"},
{k:"doc", t:"Spring AI: MCP overview", u:"https://docs.spring.io/spring-ai/reference/api/mcp/mcp-overview.html"},

M.push({
id:"m23", phase:2, weeks:"9-20 (alongside, ~3-4 h/week)", hours:46,
title:"Python for AI engineers: from Java lead to polyglot, with proof",
why:"Python is the default language of AI engineering: it appears in 45% of French AI postings against 14% for Java (Free-Work sample, Sep-Nov 2026) and in most international AI engineer postings. Your Java depth stays a differentiator, but without visible Python you get filtered out. This module makes you productive in modern Python and gives you proof: public repos, an eval suite and the PCAP certification.",
objectives:["Write idiomatic modern Python (3.12+): typing, dataclasses, Pydantic, generators, context managers, decorators","Use the 2026 toolchain: uv, ruff, pyright, pytest, pre-commit, GitHub Actions","Build an async AI service with FastAPI, httpx and the Anthropic Python SDK, with structured outputs","Build a stateful agent with LangGraph: tools, retries, human-in-the-loop, checkpoints","Test and evaluate AI code in Python (pytest + an eval suite + tracing)","Prove it: two public Python repos with results tables and the PCAP-31-04 certification"],
theory:`<h4>1. A Java lead's map of Python</h4><p>Most of what you know transfers: classes, interfaces (Python uses <b>Protocols</b> and abstract base classes), exceptions, dependency injection (done by hand or with FastAPI's <code>Depends</code>), layered architecture. What changes: dynamic typing checked by a type checker instead of a compiler, duck typing, first-class functions, and an ecosystem where scripts, notebooks and services coexist. Write Python like a senior Python developer, not like Java in Python: no getters and setters, small modules, composition over deep hierarchies, comprehensions where they read well.</p>
<h4>2. The 2026 toolchain</h4><p><b>uv</b> replaces pip, virtualenv and pip-tools (fast installs, lock file, Python versions). <b>ruff</b> lints and formats. <b>pyright</b> (or mypy) in strict mode gives you most of the safety of a compiler. <b>pytest</b> with fixtures and parametrisation is the testing standard. Put all of them in pre-commit and CI from day one: it is the first thing a reviewer looks at.</p>
<h4>3. Types and validation</h4><p>Type hints everywhere (<code>list[str]</code>, <code>str | None</code>, <code>TypedDict</code>, generics). <b>dataclasses</b> for internal data, <b>Pydantic v2</b> at the boundaries (HTTP, LLM outputs, config): it validates, coerces and serialises, and it is how you get reliable structured output from an LLM.</p>
<h4>4. Async without surprises</h4><p>LLM calls are slow I/O, so services are usually async, and this is the Python that AI postings actually test. The minimal toolkit: <code>asyncio.TaskGroup</code> for parallel calls, <code>asyncio.Semaphore</code> for provider rate limits, <code>asyncio.wait_for</code> for timeouts, <b>tenacity</b> for retries with backoff, <b>httpx</b> for HTTP and the providers' async SDKs. Never block the event loop with CPU work or a synchronous client.</p>
<h4>5. FastAPI services</h4><p>FastAPI gives typed endpoints from Pydantic models, dependency injection, OpenAPI docs and streaming responses. It is the Spring Boot of AI back-ends in Python: learn routers, dependencies, lifespan events, background tasks and testing with its test client.</p>
<h4>6. The Python AI stack</h4><p>The <b>Anthropic Python SDK</b> (messages, tool use, streaming, batches, prompt caching). <b>LangGraph</b> for stateful agents: a graph of nodes over a typed state, with checkpoints, retries and interrupts for human approval; it is the framework most cited in US AI postings after LangChain. Know what <b>Pydantic AI</b>, LlamaIndex and Google ADK are for, and when plain SDK code is enough (often).</p>
<h4>7. Tests and evals in Python</h4><p>Deterministic code gets unit tests; LLM behaviour gets an eval suite: a versioned dataset, graders (exact checks first, LLM-as-judge only where needed), a score per run and a threshold in CI. Add tracing (Langfuse or OpenTelemetry) so every failure can be inspected.</p>
<h4>8. What to skip (for now)</h4><p>To stay efficient, leave aside what AI-application postings rarely ask for: deep Django or Flask, the data-science stack beyond basic pandas, PyTorch or TensorFlow training loops (that is ML engineering, a different job), notebooks as a way of working, GUI programming, and old LangChain chain syntax. Learn them only when a concrete mission needs them.</p>
<h4>9. Proving it</h4><p>Recruiters filter on visible Python. Three proofs, in this order: (1) public repos with tests, CI and a results table; (2) paid or real-world Python work (for example AI code-evaluation missions); (3) the <b>PCAP-31-04</b> certification from the Python Institute (65 minutes, 42 questions, pass mark 72%, valid 5 years). Skip PCPP1 (USD 225): its syllabus includes GUI and socket programming you will not use. Hiring managers rank public projects above certifications; PCAP is the fast, recognised confirmation of the basics, not the main proof.</p>`,
takeaways:["Your Java design skills transfer; the idioms and the tooling do not, so practise them on purpose","uv, ruff, pyright strict and pytest in CI from the first commit","Pydantic at every boundary, especially LLM outputs","Async for LLM calls, with timeouts and retries","LangGraph for stateful agents, plain SDK code when it is enough","Proof beats claims: repos with results, real work, then PCAP"],
exercises:[
 {t:"Python katas for a Java developer", d:"Solve 30 short katas with pytest: comprehensions, generators, context managers, decorators, dataclasses, Protocols, pattern matching, itertools. For each, note the Java equivalent and what is more idiomatic in Python.", h:6},
 {t:"Project skeleton with the 2026 toolchain", d:"Create a uv project with ruff, pyright in strict mode, pytest, pre-commit and a GitHub Actions workflow. Reuse it as the template for every Python repo in the track.", h:3, u:[{t:"uv documentation",u:"https://docs.astral.sh/uv/"},{t:"Ruff documentation",u:"https://docs.astral.sh/ruff/"}]},
 {t:"Async extraction service", d:"Rebuild the lease extractor as a FastAPI service: async Anthropic SDK client, Pydantic models for the structured output, retries and timeouts, streaming endpoint, pytest with mocked LLM calls. Compare with your Java version in a short ADR.", h:8, u:[{t:"FastAPI documentation",u:"https://fastapi.tiangolo.com/"},{t:"Anthropic Python SDK (GitHub)",u:"https://github.com/anthropics/anthropic-sdk-python"},{t:"Pydantic documentation",u:"https://docs.pydantic.dev/latest/"}]},
 {t:"Stateful agent with LangGraph", d:"Build the rent-indexation agent in Python with LangGraph: typed state, tools (read lease, fetch index, compute rent, draft letter), retry on tool failure, an interrupt for human approval before sending, and a checkpointer so a run can resume.", h:8, u:[{t:"LangGraph (GitHub, docs linked from the README)",u:"https://github.com/langchain-ai/langgraph"}]},
 {t:"Eval suite and tracing", d:"Add a versioned eval dataset (30 cases), exact-match graders plus one LLM-as-judge grader, a score per run in CI with a failing threshold, and Langfuse or OpenTelemetry traces. Publish the results table in the README.", h:4},
 {t:"Container and deploy", d:"Package the service with a slim Docker image (uv in a multi-stage build), add a health check, and deploy it (Kubernetes from module 12 or a managed container service).", h:3},
 {t:"PCAP-31-04 preparation and exam", d:"Work through the official PCAP syllabus, then take two full practice exams and reach at least 80% before booking. Book and pass PCAP-31-04, then add the badge to LinkedIn and the proof ledger.", h:8, u:[{t:"Python Institute: PCAP certification",u:"https://pythoninstitute.org/certification/pcap-certification-associate/"}]},
 {t:"Publish the proof", d:"Make both Python repos public with a clear README (problem, architecture, results table, how to run), pin them on GitHub and write a short LinkedIn post: what a Java lead learned shipping AI in Python.", h:2},
 {t:"One open-source contribution", d:"Fix a documented issue (label 'good first issue' or a docs gap) in a Python AI library you use: LangGraph, Pydantic AI, Langfuse or the Anthropic SDK. A merged pull request is strong, public proof.", h:4}
],
quiz:[
 {q:"Where should Pydantic models sit in a Python AI service?",o:["Only in tests","At the boundaries: HTTP input and output, LLM structured outputs, configuration","Inside every private function","Nowhere, dicts are enough"],a:1,w:"Validate where untrusted or external data enters: requests, LLM outputs and config. Internal code can use dataclasses or plain types."},
 {q:"Your FastAPI endpoint calls the LLM with a synchronous HTTP client inside an async def. What happens under load?",o:["Nothing, Python handles it","The event loop is blocked, so every other request waits","It becomes faster","FastAPI converts it to async automatically"],a:1,w:"A blocking call inside async code freezes the event loop. Use an async client or run the sync call in a thread pool."},
 {q:"What does uv replace in a classic Python setup?",o:["pytest","pip, virtualenv and pip-tools (installs, environments, lock file)","FastAPI","The type checker"],a:1,w:"uv manages Python versions, virtual environments, dependency resolution and the lock file, much faster than pip."},
 {q:"Why use LangGraph rather than a simple loop for the rent-indexation agent?",o:["It is required by Anthropic","It gives typed state, checkpoints to resume, retries and interrupts for human approval","It makes the model smarter","It removes the need for tests"],a:1,w:"The value is control: explicit state, resumable runs and a built-in pause for human approval. For a single call, plain SDK code is enough."},
 {q:"Which proof of Python skills carries the most weight with a hiring manager?",o:["A list of courses followed","Public repos with tests, CI and measured results, then real work, then a certification","A certification alone","Years of Java experience"],a:1,w:"Hiring managers want to see working code and results; a certification such as PCAP confirms the basics but does not replace them."}
],
resources:[{t:"Le tutoriel Python officiel, en français",u:"https://docs.python.org/fr/3/tutorial/",k:"doc",l:"fr"},
 {k:"doc",t:"The Python Tutorial (official)",u:"https://docs.python.org/3/tutorial/"},
 {k:"doc",t:"uv: Python package and project manager",u:"https://docs.astral.sh/uv/"},
 {k:"doc",t:"FastAPI documentation",u:"https://fastapi.tiangolo.com/"},

 {k:"doc",t:"LangGraph (GitHub)",u:"https://github.com/langchain-ai/langgraph"},
 {k:"doc",t:"Pydantic AI (agent framework)",u:"https://ai.pydantic.dev/"},

M.push({
id:"m09", phase:2, weeks:"20", hours:30,
title:"LangChain4j, working Python and the wider ecosystem",
why:"Clients use different stacks. Being able to read and compare them makes you the trusted advisor.",
objectives:[
"Compare Spring AI and LangChain4j and choose per context",
"Choose between Java and Python per client context (module 23 builds the Python side)",
"Know when fine-tuning is (rarely) the right answer",
"Know the landscape: model providers, local models, vector databases, eval tools",
"Run a local model for confidential or offline use cases"
],
theory:`
<h4>1. Spring AI vs LangChain4j</h4>
<p>Both are solid Java options. Spring AI is the natural fit in Spring Boot shops (auto-configuration, Spring idioms, observability). LangChain4j is framework-agnostic (works with Quarkus, Micronaut, plain Java) and offers high-level "AI services" interfaces. In a Quarkus shop, LangChain4j via the Quarkus extension is often the default. Learn enough of LangChain4j to read and contribute to such projects.</p>
<h4>2. Working Python, not just reading</h4>
<p>Job-posting analyses in 2026 put Python in roughly 70 to 77% of AI engineer offers, ahead of any other skill. Even in Java-heavy banks, AI teams prototype in Python. Your target is "productive second language": write a script with the Anthropic SDK, a small FastAPI service, a notebook experiment, read LangChain, LangGraph or LlamaIndex code and port ideas to Java. Java stays your differentiator; Python removes a filter on your CV.</p>
<h4>2b. Fine-tuning: know when to say no</h4>
<p>Some postings (often Swiss banks) mention fine-tuning. In practice, prompting, RAG and tools solve most business problems faster and cheaper. Fine-tuning helps for very specific formats or styles at high volume, or distilling a large model's behaviour into a small one. You must be able to explain the trade-off (data needed, cost, maintenance, evaluation) and run a small experiment, not be an ML researcher.</p>
<h4>3. The landscape (keep it current)</h4>
<ul>
<li>Frontier model providers (Anthropic, OpenAI, Google) and European options (Mistral) that matter for French public and sovereign-cloud clients.</li>
<li>Local/open-weight models via Ollama or similar, for confidentiality, cost or offline needs. Expect lower quality than frontier models.</li>
<li>Vector stores: PGVector, Elasticsearch/OpenSearch, Qdrant, Weaviate, Redis.</li>
<li>Evaluation and observability tools: promptfoo, Langfuse, OpenTelemetry-based tracing.</li>
</ul>
<h4>4. Choosing as an advisor</h4>
<p>Decide on requirements, not hype: data sensitivity, existing stack, team skills, budget, latency, required quality. Document the trade-off in a short decision record (ADR).</p><h4>Reading TypeScript</h4><p>Most MCP servers, the Agent SDK samples and many agent tools are TypeScript-first. You don't need to master it, but reading and running a TS MCP server removes one more filter in postings.</p>`,

why:"A RAG or an agent is only as good as its data. Postings ask for SQL and pipelines next to LLM skills, and most production failures come from bad, stale or leaking data, not from the model.",
objectives:["Write the SQL an AI engineer needs: CTEs, window functions, JSON, full-text and vector queries in PostgreSQL","Build an idempotent, incremental ingestion pipeline with change detection","Measure and enforce data quality: duplicates, freshness, completeness, PII","Design metadata and permissions for retrieval","Version and manage evaluation datasets like code"],
theory:`<h4>1. SQL for AI engineers</h4><p>You already know SQL from Java projects; the AI-specific part is combining it with retrieval. In PostgreSQL: <b>CTEs</b> and <b>window functions</b> for analytics (latest version of a document, ranking), <b>JSONB</b> for flexible metadata, <b>full-text search</b> (tsvector) for keyword retrieval and <b>pgvector</b> for similarity (distance operators, HNSW or IVFFlat indexes). Hybrid search is often one SQL query with a metadata filter, a keyword score and a vector score fused together.</p>
<h4>2. Ingestion pipelines</h4><p>Production ingestion is <b>idempotent</b> (re-running gives the same result), <b>incremental</b> (only new or changed documents, detected with content hashes or timestamps) and <b>observable</b> (counts, failures, duration). Steps: fetch, parse, clean, chunk, enrich metadata, embed, upsert, delete what disappeared at the source. Deletion is the step everyone forgets, and it is a GDPR issue.</p>
<h4>3. Parsing is a data-quality problem</h4><p>PDF tables, scans, headers and footers, multi-column layouts: parsing errors silently poison retrieval. Compare parsers (plain text extraction, layout-aware tools such as Docling, or a vision model) on a sample of your real documents and measure the result, exactly like an eval.</p>
<h4>4. Data quality checks</h4><p>Check before indexing: duplicates and near-duplicates, empty or tiny chunks, encoding problems, language, freshness (last update per source), completeness (expected documents present), and <b>PII</b> (detect and mask or exclude). Automate the checks in the pipeline and fail loudly.</p>
<h4>5. Metadata and permissions</h4><p>Design metadata for filtering and access control from day one: tenant, source, document type, date, version, confidentiality level, owner. Permission filtering must happen in the retrieval query, never after generation.</p>
<h4>6. Datasets as code</h4><p>Evaluation sets, labelled samples and prompts are versioned in Git (or a dataset tool) with a changelog. Every eval result points to a dataset version, so you can compare runs honestly.</p>`,
takeaways:["Bad data beats a good model every time","Idempotent, incremental, observable: the three rules of ingestion","Delete at the source means delete in the index","Filter permissions in the query, not in the answer","Version your datasets like code"],
exercises:[
 {t:"SQL drills on your own data", d:"In PostgreSQL, load your anonymised lease metadata and write 10 queries: latest version per document (window function), rent per property (CTE), JSONB filters, a full-text query and a pgvector similarity query with a metadata filter.", h:3},
 {t:"Hybrid search in one query", d:"Write a single SQL query fusing a full-text score and a vector score (reciprocal rank fusion) with a tenant filter. Compare results with pure vector search on 10 questions.", h:3},
 {t:"Incremental ingestion job", d:"Build the Patrimony Copilot ingestion job: content hash for change detection, upsert, deletion of removed documents, run report (added/updated/deleted/failed). Run it twice and prove it is idempotent.", h:4},
 {t:"Parser comparison", d:"Parse 15 of your real documents (with tables and one scan) with two parsers. Score extraction quality by hand and record the decision in an ADR.", h:3},
 {t:"Quality gate", d:"Add automated checks before indexing: duplicates, empty chunks, PII detection, freshness. The pipeline fails with a clear message when a check fails.", h:2}
],

M.push({
id:"m10", phase:3, weeks:"21-23", hours:45,
title:"Evaluation: proving your AI works",
why:"Evals are what separate a demo from a product, and a senior AI engineer from a prompt tinkerer.",
objectives:[
"Design an evaluation dataset from real use cases",
"Combine code-based checks, LLM-as-judge and human review",
"Run evals in CI to catch regressions when prompts, models or data change",
"Report quality to stakeholders in business terms"
],
theory:`
<h4>1. Why evals</h4>
<p>LLM systems change silently: a new model version, a prompt tweak, new documents. Without a fixed evaluation set you cannot know if a change helped or hurt. Evals are the unit tests of AI behaviour, and the basis of every honest quality claim.</p>
<h4>2. Building the dataset</h4>
<ul>
<li>Start from real questions and inputs (logs, user interviews, your own use).</li>
<li>Cover the distribution: common cases, edge cases, adversarial cases, "should refuse" cases.</li>
<li>Write the expected outcome: exact value, required facts, or criteria.</li>
<li>Start with 30 to 50 good cases; grow from production failures.</li>
</ul>
<h4>3. Grading methods</h4>
<ul>
<li><b>Code-based</b>: exact match, JSON schema validity, numeric tolerance, regex, "contains the cited clause". Fast, cheap, reliable: use whenever possible.</li>
<li><b>LLM-as-judge</b>: a model grades against a rubric (correctness, faithfulness to sources, tone). Write precise rubrics, ask for reasoning then a score, and calibrate the judge against your own human labels.</li>
<li><b>Human review</b>: the ground truth for subjective quality; sample regularly.</li>
</ul>
<h4>4. What to measure</h4>
<p>Task success rate, faithfulness (no unsupported claims), refusal correctness, format validity, latency, cost per request. For RAG, separate retrieval (recall@k) from generation. Track trends, not single runs; run several times when variability matters.</p>
<h4>5. Evals in the delivery pipeline</h4>
<p>Run a fast eval subset on every pull request that touches prompts or AI code, the full set nightly or before releases. Fail the build below a threshold. Store results to compare versions. Tools like promptfoo or Langfuse help; a JUnit-based harness also works perfectly in Java shops.</p>
<h4>6. Online evaluation</h4>
<p>In production, collect user feedback (thumbs up/down, corrections), sample conversations for review, and feed failures back into the dataset. Quality management is continuous.</p><h4>Evaluating agents, not just answers</h4><p>For agents, also measure the <b>trajectory</b>: right tools called with right arguments, task completed, number of steps, cost and latency per task. Report reliability as <b>pass@k</b> (succeeds at least once in k tries) and <b>pass^k</b> (succeeds every time in k tries): production needs the second. Keep scripted scenarios with expected end states (e.g. a lease updated correctly) and run them in CI.</p>`,
takeaways:[
"No eval set, no quality claim.",
"Code checks first, LLM judges with calibrated rubrics second, humans as reference.",
"Evals in CI turn AI changes into safe engineering changes.",
"Production failures feed the dataset."
],
exercises:[
 {t:"Agent evals with pass^k", d:"Write 20 scripted scenarios for the rent-indexation agent with expected end states. Run each 5 times and report pass@5, pass^5, steps and cost per task.", h:4},
{t:"Golden dataset", d:"Build 50 cases for the lease assistant: 30 normal, 10 edge, 5 'should refuse', 5 adversarial. Store in JSON/CSV in the repo.", h:8},
{t:"JUnit eval harness", d:"Write a JUnit 5 harness that runs the dataset, applies code-based graders and outputs a report (pass rate, cost, latency). Tag it so it is excluded from normal unit tests.", h:10},
{t:"LLM judge", d:"Add a faithfulness judge with a rubric. Label 30 answers yourself and compute agreement with the judge. Iterate on the rubric until agreement is high.", h:8},
{t:"CI gate", d:"Run the fast subset on each PR in GitHub Actions and fail below 90%. Prove it catches a deliberately broken prompt.", h:6},
{t:"Model upgrade simulation", d:"Switch the default model and run the full eval. Write a one-page 'go / no-go' memo for a fictional client.", h:5},
 {t:"Paid evaluation work as proof", d:"Take a part-time AI code-evaluation mission (for example Mercor or Turing, Java or Python). Log in the proof ledger what you evaluated, the rubric used and what it taught you about graders and failure modes.", h:4}
],
quiz:[
{q:"Why can't you rely on 'it looks better' after a prompt change?", o:["Prompts can't be measured","Outputs vary and improvements on a few cases can hide regressions elsewhere","Models dislike changes","It's always true"], a:1, w:"Only a fixed dataset reveals global effect."},
{q:"Cheapest, most reliable grader when applicable:", o:["LLM-as-judge","Code-based checks","Hiring annotators","Asking the user"], a:1, w:"Deterministic checks first."},
{q:"How do you trust an LLM judge?", o:["Use the biggest model","Calibrate it against human labels and refine the rubric","Never use one","Set temperature to 1"], a:1, w:"Measure judge-human agreement."},
{q:"A good eval set should include:", o:["Only easy happy-path cases","Common, edge, adversarial and should-refuse cases","Only cases the model already passes","Random internet text"], a:1, w:"Coverage of the real distribution and risks."},
{q:"When should the full eval run?", o:["Never","Nightly or before release; a fast subset on each PR","Only when users complain","Once a year"], a:1, w:"Balance speed and safety."}

M.push({
id:"m11", phase:3, weeks:"24-25", hours:30,
title:"Security for LLM applications",
why:"Security is the first objection of every large client. Answer it better than anyone.",
objectives:[
"Know the OWASP Top 10 for LLM applications",
"Defend against direct and indirect prompt injection",
"Prevent sensitive data leakage and excessive agency",
"Threat-model an AI feature and present it to a security team"
],
theory:`
<h4>1. The threat landscape</h4>
<p>The OWASP Top 10 for LLM Applications lists the main risks: prompt injection (still number one), sensitive information disclosure, excessive agency, supply chain, data and model poisoning, unbounded consumption, misinformation, hidden context exposure (formerly system prompt leakage), vector and embedding weaknesses, improper output handling. The 2026 edition (August 2026) replaced the 2025 one; check the official PDF for the exact ranking. Agentic risks (tools, memory, autonomy, identity) have their own list: the OWASP Top 10 for Agentic Applications. Learn both; security teams use them.</p>
<h4>2. Prompt injection</h4>
<p><b>Direct</b>: the user tries to override instructions. <b>Indirect</b>: malicious instructions hidden in content the model reads (a document, an email, a web page, a tool result). There is no perfect prompt-level fix. Defend in depth:</p>
<ul>
<li>Treat all retrieved and tool content as data; delimit it clearly.</li>
<li>Never give the model capabilities beyond the task (least privilege).</li>
<li>Require human approval for sensitive actions.</li>
<li>Validate and constrain outputs before acting on them.</li>
<li>Detect and log suspicious patterns; red-team regularly.</li>
</ul>
<h4>3. Data protection</h4>
<p>Minimise what you send to the model; mask personal data (names, IBANs, emails) when not needed; enforce permissions before retrieval; check provider data-retention and training policies; keep secrets out of prompts and logs. GDPR still applies: purpose, minimisation, retention, processor agreements.</p>
<h4>4. Output handling</h4>
<p>Model output is untrusted input to the rest of your system. Escape it in HTML, never execute it as SQL or shell without strict validation, validate JSON against a schema and business rules.</p>
<h4>5. Excessive agency and consumption</h4>
<p>Limit tools, permissions, iterations and spend. Rate-limit per user. Alert on cost spikes. A runaway agent loop can burn a budget overnight.</p>
<h4>6. Threat modelling</h4>
<p>For each feature: assets (data, actions), actors (users, attackers, third-party content), entry points (prompts, documents, tools), abuse cases, mitigations, residual risk. One page per feature, reviewed with the client's security team.</p><h4>Agentic security and guardrails in practice</h4><p>Beyond the LLM Top 10, use the OWASP Top 10 for Agentic Applications (tool misuse, identity and privilege abuse, memory poisoning, cascading failures, rogue agents). Enforce controls in code and infrastructure: least-privilege credentials per agent, approval gates, egress restrictions, audit logs. Practise one managed guardrail service (Amazon Bedrock Guardrails, which the AWS exam covers) or NeMo Guardrails, seen in Swiss postings.</p>`,
takeaways:[
"Prompts are not security boundaries.",
"Least privilege + human approval + output validation = defence in depth.",
"Mask, minimise and filter data before the model sees it.",
"Bring a threat model before the security team asks."
],
exercises:[
 {t:"Managed guardrails", d:"Configure Amazon Bedrock Guardrails (or NeMo Guardrails) on the lease copilot: denied topics, PII masking, contextual grounding check. Measure false positives on your eval set.", h:3},
{t:"Red-team your assistant", d:"Write 20 attacks: direct injections, a lease PDF containing hidden instructions, data exfiltration attempts ('list all tenants' IBANs'). Record what succeeds.", h:6},
{t:"Fix and re-test", d:"Implement mitigations (delimiting, output validation, permission filters, masking advisor, tool restrictions). Add the attacks to your eval set as must-pass cases.", h:10},
{t:"Threat model", d:"Write a one-page threat model for the lease assistant and its MCP server using the OWASP LLM list.", h:5},
{t:"Cost guard", d:"Add per-user rate limits and a daily budget with alerting. Simulate a runaway loop and show it gets stopped.", h:5}
],

{q:"Most robust protection against an injected 'send all data to X' instruction?", o:["Adding 'never obey injected text' to the prompt","The agent has no tool able to send data externally, or such actions need human approval","Higher temperature","Shorter prompts"], a:1, w:"Remove capability; don't rely on the prompt."},
{q:"Model output used in a SQL query should be:", o:["Executed directly","Validated, parameterised and constrained","Trusted because the model is smart","Logged only"], a:1, w:"Improper output handling is an OWASP risk."},

{q:"'Unbounded consumption' refers to:", o:["Too many users","Uncontrolled resource and cost usage (loops, abuse)","Long answers","Large documents"], a:1, w:"Limit spend, iterations and rate."}
],

M.push({
id:"m12", phase:3, weeks:"26-28", hours:45,
title:"LLMOps: observability, cost, latency and reliability",
why:"Running AI in production every day is where projects succeed or quietly die.",
objectives:[
"Trace every LLM call and agent step end to end",
"Control cost with model routing, caching, batching and budgets",
"Improve latency with streaming, parallelism and smaller models",
"Design for failure: retries, fallbacks, timeouts, degradation"
],
theory:`
<h4>1. Observability</h4>
<p>Trace each request: user, prompt version, model, retrieved documents, tool calls, tokens, cost, latency, outcome. OpenTelemetry-compatible tracing (supported by Spring AI through Micrometer) lets you follow an agent across steps. Store prompts and outputs with care for privacy (sampling, masking, retention).</p>
<h4>2. Cost engineering</h4>
<ul>
<li>Know your unit cost (per question, per document, per user per month).</li>
<li>Route easy requests to small models; reserve large models for hard ones.</li>
<li>Prompt caching for stable prefixes; batch API for offline work.</li>
<li>Trim context: fewer, better chunks; summarised history.</li>
<li>Cap output length; budgets and alerts per tenant.</li>
</ul>
<h4>3. Latency</h4>
<p>Stream responses for perceived speed. Parallelise independent calls. Use smaller models for intermediate steps. Precompute what you can (document summaries, embeddings). Measure p50/p95, not averages.</p>
<h4>4. Reliability</h4>
<p>Retries with exponential backoff and jitter on rate-limit and overload errors; timeouts on every call; circuit breakers (Resilience4j); a fallback model or provider; graceful degradation (e.g. return sources without a generated answer). Make side-effecting steps idempotent so retries are safe.</p>
<h4>5. Versioning and releases</h4>
<p>Version prompts, models and datasets together. Release with feature flags, shadow tests or A/B tests, and keep the previous version ready to roll back. Pin model versions in production and upgrade deliberately after evals.</p><h4>Tracing standard and cost levers</h4><p>Emit traces with the OpenTelemetry GenAI semantic conventions (<code>gen_ai.*</code> attributes: operation, model, input/output tokens; spans for agents and tool calls); the conventions are still in development, so pin a version. The Claude API can emit OpenTelemetry spans itself. Cost levers in 2026: effort level, model routing, prompt caching (monitor the cache hit rate), Batch API combined with caching, per-tenant budgets, and remember that tokenizers differ between models when you compare prices.</p>`,
takeaways:[
"Trace everything, with privacy in mind.",
"Unit cost is a design input.",
"Measure p95, stream, parallelise.",
"Pin versions, gate upgrades with evals, keep rollback ready."
],
exercises:[
 {t:"OpenTelemetry GenAI traces", d:"Instrument the copilot with gen_ai.* spans (model, tokens, tool calls), export to Jaeger or Langfuse, and build a cost-per-question and cache-hit-rate panel.", h:3},
{t:"Tracing", d:"Add OpenTelemetry tracing to the lease assistant; view a full agent run (retrieval, tools, model calls) in Jaeger or Grafana Tempo.", h:8},
{t:"Cost dashboard", d:"Compute cost per request from token metrics and build a dashboard with daily spend per user and per feature.", h:6},
{t:"Resilience", d:"Add Resilience4j retry, timeout and circuit breaker around model calls, plus a fallback to a smaller model. Test with a fake failing provider.", h:8},
{t:"Optimisation sprint", d:"Reduce cost per question by 50% without losing more than 2 points of eval score (routing, caching, context trimming). Document each step's effect.", h:12},
{t:"Release process", d:"Write a one-page runbook for upgrading the model version: eval, shadow traffic, rollout, rollback.", h:4},
 {t:"Agent on Kubernetes", d:"Deploy the containerised agent on a local Kubernetes cluster (kind or k3d): deployment, service, config and secret, liveness and readiness probes, resource limits, and OpenTelemetry traces exported to Langfuse or Jaeger. Kubernetes appears in about a quarter of French AI postings.", h:5}
],

{q:"Why pin model versions in production?", o:["Pinned models are cheaper","To avoid silent behaviour changes; upgrade only after evals","It's mandatory","To disable caching"], a:1, w:"Controlled upgrades."},
{q:"Safe retries require side-effecting steps to be:", o:["Fast","Idempotent","Logged in French","Cached"], a:1, w:"Retrying must not duplicate effects."},

M.push({
id:"m13", phase:3, weeks:"29-30", hours:30,
title:"Cloud AI platforms and compliance (EU AI Act, GDPR)",
why:"Large French clients buy AI through their cloud and their legal team. Speak both languages.",
objectives:[
"Use Claude through AWS Bedrock and know the Azure and Google equivalents",
"Explain data residency, retention and enterprise contracts",
"Understand the EU AI Act risk categories and timeline, and GDPR duties for AI",
"Prepare a compliance-ready project file for a client"
],
theory:`
<h4>1. Access paths</h4>
<p>Claude is available directly from Anthropic and through AWS Bedrock, Google Cloud Vertex AI and Microsoft's AI platform. Enterprises often prefer their cloud for billing, IAM, private networking and EU regions. Spring AI supports Bedrock and other providers, so your code changes little.</p>
<h4>2. Data questions every client asks</h4>
<ul>
<li>Where is data processed and stored? (region)</li>
<li>Is it used for training? How long is it retained?</li>
<li>Who can access logs? Is there a data processing agreement?</li>
<li>How are secrets, keys and identities managed?</li>
</ul>
<p>Prepare a standard one-page answer per provider, citing official documentation.</p>
<h4>3. EU AI Act essentials</h4>

theory:`
<h4>1. Where the value is</h4>
<p>High volume, repetitive, text-heavy tasks with clear rules and tolerance for review: invoice and contract processing, email triage, ticket classification, report drafting, data cleaning, compliance checks. You live this every day with your own property and company admin; the same patterns apply to a property manager, a logistics firm or an accounting office.</p>
<h4>2. The document AI pipeline</h4>
<ol>
<li><b>Intake</b>: email, upload, scanner, API. Normalise (PDF to text and images).</li>
<li><b>Classify</b>: what is this document? (small model)</li>
<li><b>Extract</b>: structured fields with schema.</li>
<li><b>Validate</b>: business rules in code (dates coherent, totals match, IBAN valid).</li>
<li><b>Human review</b> for low-confidence or high-stakes items.</li>
<li><b>Integrate</b>: write to ERP/CRM/accounting, file the document, notify.</li>
</ol>
<h4>3. Designing for business users</h4>
<p>Non-technical teams need: clear prompts packaged as buttons or templates, Claude Projects or skills with their procedures, review screens that show the source next to the extracted value, and a simple way to report errors. The best AI feature is invisible: it pre-fills, the human confirms.</p>
<h4>4. Discovery and ROI</h4>
<p>Interview the people doing the work. Measure the baseline: volume per month, minutes per item, error rate, cost. Estimate automation rate (say 70% straight-through), review time on the rest, run cost. Present a payback period. Then pilot on real data for 2 to 4 weeks before promising anything.</p>
<h4>5. Change management</h4>
<p>People fear replacement. Position AI as removing drudgery, involve users in testing, keep humans accountable for decisions, and train them. Adoption is usually the real bottleneck, not technology.</p>`,

theory:`
<h4>1. The adoption playbook</h4>
<ol>
<li><b>Baseline</b>: measure lead time, PR size, defect rate, review time for a month.</li>
<li><b>Pilot</b> with 2 or 3 volunteers on real tasks.</li>
<li><b>Standardise</b>: shared CLAUDE.md, skills for team conventions, a review subagent, hooks for formatting and tests, allowed commands, a plugin to distribute it all.</li>
<li><b>Train</b>: pair sessions, demo of good and bad usage, a written playbook.</li>
<li><b>Measure again</b> and adjust.</li>
</ol>
<h4>2. Quality and security rules</h4>
<ul>
<li>Humans own every merged line; AI code gets the same review as human code.</li>
<li>Tests before or with code; no merge without passing CI.</li>
<li>No secrets or customer data in prompts; enterprise accounts with proper data policies.</li>
<li>Sandboxed autonomy only; protected branches and folders via hooks and permissions.</li>
<li>Watch for licence and dependency risks in generated code.</li>
</ul>
<h4>3. The people side</h4>
<p>Seniors may resist ("it writes bad code"), juniors may over-trust it and stop learning. Coach both: seniors use it for the boring 60%, juniors must explain every generated line and write some code by hand. Celebrate measurable wins, not hype.</p>
<h4>4. New team workflows</h4>
<p>AI first-pass code review on PRs, test generation for legacy code, migration campaigns (Java/Spring version upgrades) run with agents and verified by tests, documentation kept current automatically, parallel agents on separate worktrees for independent tasks.</p>
<h4>5. Measuring impact</h4>
<p>Use DORA-style metrics (lead time, deployment frequency, change failure rate) plus review load and developer satisfaction. Report honestly, including where AI did not help.</p>`,

<p>Clients often ask for "a ChatGPT for our company". Translate it: which users, which task, what volume, what error tolerance, which data, which success metric. Score use cases on value, feasibility (data available, risk) and time to first result.</p>

<ol>
<li><b>Audit / discovery</b> (2 to 5 days): processes, data, quick wins, risks, roadmap.</li>

<li><b>Run and improve</b>: monitoring, evals, new use cases.</li>

<p>Each step has a clear deliverable and a go/no-go. This structure lets you sell fixed-price packages on top of day-rate work.</p>

<p>Context, objective with metric, scope in/out, approach, risks and mitigations, team and planning, price, next step. Short beats long.</p>

<ul>

<p>Start 2 to 3 months before a mission ends. Keep a simple CRM (even a spreadsheet): contact, status, next action.</p>

<p>Full remote is rarer and more competitive in France; it is more common with startups and international clients. Strong English, async communication skills and visible output (repos, articles) are what win remote missions. Invoicing foreign clients through your company is usually simple within the EU and Switzerland (check VAT rules with your accountant).</p>

theory:`<h4>1. The Forward Deployed mindset</h4><p>The fastest-growing AI role in 2026 is the <b>Forward Deployed Engineer</b>: an engineer who sits with the customer, finds the use case worth automating, ships it to production and measures the result. As a freelance consultant you already do half of it. The missing half: discovery, framing and measurable outcomes.</p>

<h4>3. Writing that gets decisions</h4><p>One-page design doc: context, goal and non-goals, options considered, decision, risks, metrics, rollout. Bottom line first. Numbers over adjectives. Every AI project you ship gets one.</p>

<h4>6. Influence and demos</h4><p>Demo the user's real case, not a toy. Show the failure handling. End with the metric and the next step. Teach: a workshop or internal talk positions you as the expert faster than any certificate.</p>`,

const TR_SYS="Tu traduis en français, pour un développeur senior français qui suit une formation d'AI engineer en anglais. Règles : traduction naturelle et précise, pas mot à mot. Garde en anglais les termes techniques que les développeurs français emploient tels quels (RAG, embeddings, prompt, token, fine-tuning, agent, eval, pipeline...), avec si utile la traduction entre parenthèses à la première occurrence. Conserve le code, les noms propres et les chiffres. Réponds uniquement avec la traduction, sans introduction. Si le texte contient des expressions idiomatiques ou des termes clés délicats, ajoute après une ligne vide une liste de 3 points maximum au format \"- terme : explication courte\". Pour un mot seul ou une expression courte, donne la traduction puis le sens dans ce contexte en une phrase. N'utilise jamais de tiret cadratin.";
function trEl(id){return document.getElementById(id);}
function trUI(){if(trEl("trBtn"))return;
 const b=document.createElement("button");b.id="trBtn";b.className="trbtn";b.type="button";b.textContent="🇫🇷 Traduire";b.title="Traduire la sélection (Alt+T)";document.body.appendChild(b);
 const p=document.createElement("div");p.id="trPop";p.className="trpop";p.setAttribute("role","dialog");p.setAttribute("aria-label","Traduction");document.body.appendChild(p);
 b.addEventListener("mousedown",e=>e.preventDefault());b.addEventListener("click",trRun);}
function trHide(){["trBtn","trPop"].forEach(id=>{const e=trEl(id);if(e)e.classList.remove("on");});}
function trPlace(el,r,below){const w=el.offsetWidth,h=el.offsetHeight;let x=r.left+r.width/2-w/2,y=below?r.bottom+8:r.top-h-8;
 if(below&&y+h>innerHeight-8)y=r.top-h-8;if(!below&&y<8)y=r.bottom+8;
 x=Math.max(8,Math.min(x,innerWidth-w-8));y=Math.max(8,Math.min(y,innerHeight-h-8));el.style.left=x+"px";el.style.top=y+"px";}
function trCheck(){const b=trEl("trBtn");if(!b)return;const s=window.getSelection();const t=s&&s.rangeCount?s.toString().replace(/\s+/g," ").trim():"";
 if(t.length<2){b.classList.remove("on");return;}
 const n=s.anchorNode,a=n&&(n.nodeType===1?n:n.parentElement);if(a&&a.closest("input,textarea,#trPop,#trBtn"))return;
 const r=s.getRangeAt(0).getBoundingClientRect();if(!r.width&&!r.height)return;
 trSel=t.slice(0,3000);trRect=r;b.classList.add("on");trPlace(b,r,false);}
function trFmt(t){return mdLite(t.replace(/\s*—\s*/g,", "));}
async function trRun(){const t=trSel;if(!t)return;const id=++trN,p=trEl("trPop");trEl("trBtn").classList.remove("on");
 const show=body=>{if(id!==trN)return;p.innerHTML=`<div class="trh"><b>🇫🇷 Traduction</b><button type="button" class="trc" title="Copier">📋</button><button type="button" class="trx" aria-label="Fermer">✕</button></div><div class="trsrc">${esc(t.length>280?t.slice(0,280)+"…":t)}</div><div class="trout">${body}</div>`;
  p.classList.add("on");trPlace(p,trRect,true);p.querySelector(".trx").onclick=trHide;
  p.querySelector(".trc").onclick=()=>{try{navigator.clipboard.writeText(p.querySelector(".trout").innerText);toast("📋 Copié");}catch(e){}};};
 if(!aiKey()){show(`Ajoute ta clé Anthropic dans <a href="#/settings">Settings</a> pour activer la traduction.`);return;}
 if(TR_CACHE.has(t)){show(trFmt(TR_CACHE.get(t)));return;}
 show(`<span class="muted">⏳ Traduction…</span>`);
 const h=document.querySelector("main h1");const ctx=h?h.textContent.trim():"";
 try{const r=(await callClaude(TR_SYS,[{role:"user",content:`${ctx?"Page : "+ctx+"\n\n":""}Texte à traduire :\n"""${t}"""`}],{model:aiModels().fast,max:1500})).trim();
  TR_CACHE.set(t,r);show(trFmt(r));}catch(e){show(`⚠️ ${esc(e.message)}`);}}
(function(){trUI();const later=()=>{clearTimeout(trT);trT=setTimeout(trCheck,30);};
 document.addEventListener("mousedown",e=>{trDown=true;if(!e.target.closest("#trPop,#trBtn"))trHide();});
 document.addEventListener("mouseup",()=>{trDown=false;later();});
 document.addEventListener("keyup",e=>{if(e.shiftKey||e.key==="Shift")later();});
 document.addEventListener("selectionchange",()=>{if(trDown)return;clearTimeout(trT2);trT2=setTimeout(trCheck,350);});
 document.addEventListener("keydown",e=>{if(e.key==="Escape")trHide();else if(e.altKey&&e.code==="KeyT"){const s=window.getSelection();if(s&&s.toString().trim()){e.preventDefault();trCheck();trRun();}}});
 window.addEventListener("scroll",()=>{const b=trEl("trBtn");if(b)b.classList.remove("on");},{passive:true,capture:true});
 window.addEventListener("hashchange",trHide);})();

// ---- whole-site EN/FR switch: AI translation of what is displayed, cached in this browser ----
const LGK="aiTrack.lang",LGC="aiTrack.frCache";let LG_CACHE=null,lgBusy=0,lgT=null,lgWarned=false;const lgFly=new Set();
const LG_SKIP="script,style,textarea,pre,code,kbd,.notr,.bub,#ivAI,#trPop,#trBtn,#langBtn,#toast";
const LG_BLK="p,li,h1,h2,h3,h4,td,th,.why,.et,label,small,div";
const LG_INL=new Set(["B","I","EM","STRONG","CODE","A","SPAN","BR","SMALL","U","SUB","SUP"]);
const LG_SYS="You translate the interface and course content of an English learning website for a senior French developer. Translate each item of the JSON array \"t\" from English to natural, precise French. Items may contain HTML: keep every tag and attribute exactly as is and translate only the visible text. Keep in English the technical terms French developers use as is (RAG, embeddings, prompt, token, fine-tuning, agent, eval, pipeline, cloud...). Keep emojis, numbers, code, product and certification names, URLs and [bracket] placeholders unchanged. If an item is already French or untranslatable, return it unchanged. Never use an em dash. Return {\"t\":[...]} with exactly the same number of items, in the same order.";
function lang(){try{return localStorage.getItem(LGK)||"en";}catch(e){return "en";}}
function lgCache(){if(!LG_CACHE){try{LG_CACHE=JSON.parse(localStorage.getItem(LGC)||"{}");}catch(e){LG_CACHE={};}}return LG_CACHE;}
function lgSave(){try{localStorage.setItem(LGC,JSON.stringify(LG_CACHE));}catch(e){}}
function lgSafe(h){return h.replace(/<\s*\/?\s*(script|iframe|object|embed|style)[^>]*>/gi,"").replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"").replace(/\s*—\s*/g,", ");}
function lgInline(el){for(const d of el.querySelectorAll("*")){if(!LG_INL.has(d.tagName)||d.id||[...d.attributes].some(a=>a.name.startsWith("data-")||a.name.startsWith("on")))return false;}return true;}
function lgMarked(n,stop){for(let p=n;p&&p!==stop;p=p.parentElement)if(p.__lgb||p.__fr)return true;return false;}
function lgCollect(root){const blocks=[],texts=[];
 root.querySelectorAll(LG_BLK).forEach(el=>{if(el.__fr||el.closest(LG_SKIP)||lgMarked(el.parentElement,root))return;
  if(!/[A-Za-z]{2,}/.test(el.textContent)||!lgInline(el))return;el.__lgb=1;blocks.push(el);});
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 while((n=w.nextNode())){const t=n.nodeValue.trim();if(!t||n.__fr||!/[A-Za-z]{2,}/.test(t))continue;const pe=n.parentElement;
  if(!pe||pe.closest(LG_SKIP)||lgMarked(pe,null))continue;texts.push(n);}
 blocks.forEach(el=>el.__lgb=0);return {blocks,texts};}
function lgApply(it,f){if(it.el){it.el.innerHTML=lgSafe(f);it.el.__fr=1;}else{const v=it.n.nodeValue;it.n.nodeValue=v.match(/^\s*/)[0]+f.replace(/\s*—\s*/g,", ")+v.match(/\s*$/)[0];it.n.__fr=1;}}
function lgFlag(){const b=document.getElementById("langBtn");if(!b)return;const fr=lang()==="fr";b.textContent=fr?"🇬🇧":"🇫🇷";
 b.title=lgBusy?"Traduction en cours…":(fr?"Switch to English":"Passer le site en français");b.classList.toggle("busy",lgBusy>0);}
function lgRun(){if(lang()!=="fr")return;const C=lgCache(),todo=[];
 ["main","side"].map(id=>document.getElementById(id)).filter(Boolean).forEach(r=>{const {blocks,texts}=lgCollect(r);
  blocks.forEach(el=>{const s=el.innerHTML.trim();todo.push({k:"h:"+s,src:s,el});});texts.forEach(n=>{const s=n.nodeValue.trim();todo.push({k:"t:"+s,src:s,n});});});
 const miss=[];todo.forEach(it=>{const f=C[it.k];if(f!=null)lgApply(it,f);else if(!lgFly.has(it.k))miss.push(it);});
 if(!miss.length)return;
 if(!aiKey()){if(!lgWarned){toast("🇫🇷 Ajoute ta clé Anthropic dans Settings pour traduire le site");lgWarned=true;}return;}
 const uniq=[...new Map(miss.map(it=>[it.k,it])).values()],batches=[];let cur=[],len=0;
 uniq.forEach(it=>{if(cur.length&&(cur.length>=40||len+it.src.length>7000)){batches.push(cur);cur=[];len=0;}cur.push(it);len+=it.src.length;lgFly.add(it.k);});if(cur.length)batches.push(cur);
 lgBusy++;lgFlag();
 (async()=>{try{for(let i=0;i<batches.length;i+=3){await Promise.all(batches.slice(i,i+3).map(async b=>{
   try{const j=await askJSON(LG_SYS,JSON.stringify({t:b.map(x=>x.src)}),{model:aiModels().fast,max:8000});const out=j.t||[];
    if(out.length===b.length)b.forEach((x,k)=>{if(typeof out[k]==="string")C[x.k]=out[k];});}
   catch(e){if(!lgWarned){toast("⚠️ Traduction : "+e.message);lgWarned=true;}}
   finally{b.forEach(x=>lgFly.delete(x.k));}}));lgSave();lgRun();}}
  finally{lgBusy--;lgFlag();}})();}
function lgToggle(){const to=lang()==="fr"?"en":"fr";try{localStorage.setItem(LGK,to);}catch(e){}lgWarned=false;document.documentElement.lang=to;lgFlag();
 if(typeof route==="function")route();lgRun();}
(function(){const b=document.createElement("button");b.id="langBtn";b.className="langbtn";b.type="button";b.onclick=lgToggle;document.body.appendChild(b);
 document.documentElement.lang=lang();lgFlag();const mo=new MutationObserver(()=>lgRun());
 ["main","side"].forEach(id=>{const e=document.getElementById(id);if(e)mo.observe(e,{childList:true,subtree:true});});})();
